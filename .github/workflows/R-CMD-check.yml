name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::renv
          needs: check

      - name: Restore renv lockfile
        run: renv::restore()
        shell: Rscript {0}

      - name: Run tests
        run: |
          install.packages("testthat")
          testthat::test_local(".")
        shell: Rscript {0}
