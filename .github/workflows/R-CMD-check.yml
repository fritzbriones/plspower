name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::renv
          needs: check


      - name: Run tests
        run: Rscript -e 'source("app.R"); st <- run_self_test(); cat(if (st$pass) "SELF-TEST PASSED" else "SELF-TEST FAILED", "\n"); if (!isTRUE(st$pass)) quit(status = 1)'
